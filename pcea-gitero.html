<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCEA Gitero Church, Nyeri</title>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2fc;--grad:linear-gradient(180deg,#d6e4fb 0,#eaf0fc 520px,#f5f7fd 100%);--surf:#fff;--ink:#14153a;--mute:#4a4d78;--green:#2b2a86;--gold:#f2b01e;--red:#c4231a;--line:#cfd6ee;--hero:#24227a;--herotx:#f5f6fd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f2e;--grad:linear-gradient(180deg,#14165a 0,#0e0f2e 520px);--surf:#181a47;--ink:#e9ebfb;--mute:#a7abd6;--green:#a9b3ff;--red:#ff8f86;--line:#2c2f6b;--hero:#15165a}}
:root[data-theme="dark"]{--bg:#0e0f2e;--grad:linear-gradient(180deg,#14165a 0,#0e0f2e 520px);--surf:#181a47;--ink:#e9ebfb;--mute:#a7abd6;--green:#a9b3ff;--red:#ff8f86;--line:#2c2f6b;--hero:#15165a}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:64px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);background-image:var(--grad);background-repeat:no-repeat;color:var(--ink);font:17px/1.6 "Source Sans 3",system-ui,sans-serif}
h1,h2,h3{font-family:Bitter,Georgia,serif;line-height:1.2;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;align-items:center;padding:10px 20px;background:var(--hero);color:var(--herotx);overflow-x:auto}
nav b{font-family:Bitter,serif;margin-right:auto;white-space:nowrap}
nav a,nav button{color:inherit;text-decoration:none;padding:6px 12px;border-radius:6px;white-space:nowrap;background:none;border:0;font:inherit;cursor:pointer}
nav a:hover,nav button:hover{background:rgba(255,255,255,.12)}
.hero{background:linear-gradient(150deg,var(--hero),#35329b);border-bottom:6px solid var(--red);color:var(--herotx);padding:72px 20px 80px}
.wrap{max-width:1000px;margin:0 auto}
.hero p.sm{color:#c9d8cc;margin:0 0 20px}
.hero h1{font-size:clamp(34px,7vw,68px);font-weight:800;max-width:14ch}
.hero .ref{margin:20px 0 28px;color:var(--gold);font-weight:600}
.btn{display:inline-block;background:var(--gold);color:#1b1405;padding:12px 22px;border-radius:8px;font-weight:600;text-decoration:none}
section{padding:64px 20px}
section h2{font-size:clamp(26px,4vw,38px);margin-bottom:12px}
.lead{color:var(--mute);max-width:62ch;margin:0 0 28px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tab{padding:10px 16px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);border-radius:8px;font:600 16px "Source Sans 3",sans-serif;cursor:pointer}
.tab[aria-selected=true]{background:var(--green);border-color:var(--green);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected=true]{color:#10113a}}
:root[data-theme="dark"] .tab[aria-selected=true]{color:#10113a}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:22px;grid-template-columns:1.2fr 1fr}
@media(max-width:760px){.panel{grid-template-columns:1fr;padding:20px}}
.panel h3{font-size:24px;margin-bottom:4px}
.who{color:var(--red);font-weight:600;margin:0 0 14px}
.panel h4{margin:16px 0 4px;font-size:16px}
.panel p{margin:0}
.motto{border-left:4px solid var(--gold);padding-left:14px;font-family:Bitter,serif;font-size:19px}
.vals{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:8px 0 0;list-style:none}
.vals li{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:15px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.d{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;overflow:hidden}
.d .top{padding:18px 18px 14px}
.d h3{font-size:21px}
.d .more{max-height:0;overflow:hidden;padding:0 18px;color:var(--mute);transition:max-height .25s,padding .25s}
.d[aria-expanded=true] .more{max-height:140px;padding:0 18px 18px}
.d[aria-expanded=true]{border-color:var(--green)}
.d small{color:var(--mute)}
.lead-card{display:flex;gap:16px;flex-wrap:wrap}
.pc{flex:1 1 260px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:20px}
.pc p{margin:0;color:var(--mute)}
.pc b{font-family:Bitter,serif;font-size:20px;display:block}
.band{background:var(--surf);border-block:1px solid var(--line)}
footer{padding:36px 20px;background:var(--hero);border-top:6px solid var(--gold);color:#c9d8cc}
footer b{color:var(--herotx)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.d .more{transition:none}}
.hero-in{display:flex;align-items:center;justify-content:space-between;gap:32px}
.crest{height:250px;width:auto;border-radius:16px;border:3px solid var(--gold);background:#9ebfee}
@media(max-width:700px){.hero-in{flex-direction:column-reverse;align-items:flex-start}.crest{height:170px}}
.ph{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.logo{height:88px;width:auto;max-width:170px;object-fit:contain;background:#fff;border-radius:12px;padding:6px;border:1px solid var(--line)}
.theme{border:1.5px solid rgba(255,255,255,.5)!important}
.time{font-family:Bitter,serif;font-size:22px;display:block;margin-top:6px;color:var(--ink)}
.pc.red{border-top:5px solid var(--red)}.pc.gold{border-top:5px solid var(--gold)}
</style>
</head>

const DIST=[
{n:'Bethsaida',l:'Elder Mary Ngatia'},
{n:'Jordan',l:'Elder Joan Kibethi'},
{n:'Sinai',l:'Elder John Njoroge'},
{n:'Macedonia',l:'Elder John Njoroge'}];

function Ministries(){
 const [id,setId]=useState('cs');const m=MIN.find(x=>x.id===id);
 return html`<section id="groups"><div class="wrap">
  <h2>Fellowships and groups</h2>
  <p class="lead">There is a place for everyone at Gitero. Choose a group to see its vision, mission, and values.</p>
  <div class="tabs" role="tablist">${MIN.map(x=>html`<button key=${x.id} role="tab" class="tab" aria-selected=${x.id===id} onClick=${()=>setId(x.id)}>${x.tab}</button>`)}</div>
  <div class="panel" role="tabpanel" key=${id}>
   <div>
    <div class="ph">${LOGO[m.id]&&html`<img class="logo" src=${LOGO[m.id]} alt=${m.tab+' logo'}/>`}<div><h3>${m.tab}</h3><p class="who">${m.who}</p></div></div>
    <p>${m.about}</p>
    ${m.vision&&html`<h4>Vision</h4><p>${m.vision}</p>`}
    ${m.mission&&html`<h4>Mission</h4><p>${m.mission}</p>`}
    ${m.time&&html`<h4>When we meet</h4><p>${m.time}</p>`}
    ${m.verse&&!m.quote&&html`<h4>Key Bible verse</h4><p>${m.verse}</p>`}
   </div>
   <div>
    ${m.motto&&html`<h4 style=${{marginTop:0}}>Motto</h4><p class="motto">${m.motto}</p>`}
    ${m.quote&&html`<h4 style=${{marginTop:0}}>Key Bible verse</h4><p class="motto">“${m.quote}”<br/><small>${m.verse}</small></p>`}
    ${m.vals&&html`<h4>${m.id==='bb'?'Four-square focus and foundations':'Core values'}</h4>
    <ul class="vals">${m.vals.map(v=>html`<li key=${v}>${v}</li>`)}</ul>`}
   </div>
  </div></div></section>`;
}

function Districts(){
 const [open,setOpen]=useState(null);
 return html`<section id="districts" class="band"><div class="wrap">
  <h2>Our four districts</h2>
  <p class="lead">Members worship and serve together in districts, each led by an elder. Select a district to see its leader.</p>
  <div class="grid">${DIST.map(d=>html`<button key=${d.n} class="d" aria-expanded=${open===d.n} onClick=${()=>setOpen(open===d.n?null:d.n)}>
    <div class="top"><h3>${d.n}</h3><small>${open===d.n?'Hide leader':'Show leader'}</small></div>
    <div class="more">District leader<br/><b style=${{color:'var(--ink)'}}>${d.l}</b></div></button>`)}</div>
 </div></section>`;
}

function App(){
 const [isDark,setDark]=useState(()=>matchMedia('(prefers-color-scheme: dark)').matches);
 React.useEffect(()=>{document.documentElement.dataset.theme=isDark?'dark':'light'},[isDark]);
 const toggle=()=>setDark(d=>!d);
 return html`<div>
  <nav aria-label="Main"><b>PCEA Gitero</b><a href="#about">About</a><a href="#services">Services</a><a href="#leaders">Leaders</a><a href="#districts">Districts</a><a href="#groups">Groups</a><button class="theme" onClick=${toggle} aria-pressed=${isDark}>${isDark?'Light mode':'Dark mode'}</button></nav>
  <header class="hero"><div class="wrap hero-in"><div>
   <p class="sm">Presbyterian Church of East Africa · Nyeri, Kenya</p>
   <h1>As for me and my house, we will serve the Lord.</h1>
   <p class="ref">Joshua 24:15</p>
   <a class="btn" href="#groups">Find your fellowship</a>
  </div><img class="crest" src=${LOGO.pcea} alt="PCEA crest with the words Faith, Hope, Love"/></div></header>
  <section id="about"><div class="wrap">
   <h2>Welcome to PCEA Gitero Church</h2>
   <p class="lead">Gitero is one of the six congregations of the Nyeri Joy Parish. We are a community of families, women, men, young people, and teens learning to worship, serve, and follow Christ together.</p>
  </div></section>
  <section id="services"><div class="wrap">
   <h2>Service times</h2>
   <p class="lead">Come as you are. Everyone is welcome.</p>
   <div class="lead-card">
    <div class="pc red"><p>Kikuyu service</p><span class="time">10:00 A.M. to 12:00 P.M.</span></div>
    <div class="pc gold"><p>Church School service</p><span class="time">8:30 A.M. to 11:30 A.M.</span></div>
   </div>
  </div></section>
  <section id="leaders" class="band"><div class="wrap">
   <h2>Leadership</h2>
   <p class="lead">The people who shepherd and serve our church family.</p>
   <div class="lead-card">
    <div class="pc"><p>Parish minister, Nyeri Joy Parish</p><b>Reverend Daniel Wachira</b></div>
    <div class="pc"><p>Chairperson, Gitero Church</p><b>Elder John Njoroge</b></div>
   </div>
  </div></section>
  <${Districts}/>
  <${Ministries}/>
  <footer><div class="wrap"><b>PCEA Gitero Church</b><br/>Nyeri Joy Parish, Nyeri, Kenya</div></footer>
 </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
